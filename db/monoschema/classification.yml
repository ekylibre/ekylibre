# Classification des tables — point 1.5 de la feuille de route v6.
#
# Ce fichier ne porte que des *décisions*. Tout ce qui se mesure — colonnes,
# index, clés étrangères, géométries — est engendré dans `plan.yml` par
# `rake monoschema:classify`, qui lit `db/structure.sql`.
#
# Trois plans, et la règle qui les sépare :
#
#   données     — la ligne appartient à une ferme. `tenant_id`, PK composite,
#                 RLS `FORCE`. C'est le défaut, mais un défaut *choisi* : toute
#                 table y figure nommément, et `rake monoschema:check` échoue
#                 sur une table qui n'apparaîtrait nulle part.
#   contrôle    — la ligne n'appartient à personne, ou à tout le monde :
#                 infrastructure et identité inter-fermes. Hors RLS.
#   référentiel — le schéma `lexicon` en entier, partagé et lu seulement. Rien
#                 à déclarer ici : l'appartenance au schéma suffit.
#
# `uuid_v7` porte la décision de l'ADR-003, la seule vraiment irréversible :
# ce que le terrain peut créer hors ligne engendre sa clé côté client, donc en
# UUIDv7. Le reste garde une clé entière. Le critère est « le mobile peut-il en
# créer une ligne sans réseau ? », pas « est-ce important ».

control:
  schema_migrations: "infrastructure Rails : une seule par base, jamais par ferme"
  ar_internal_metadata: "infrastructure Rails : une seule par base, jamais par ferme"

uuid_v7:
  interventions: "l'ADR-003 la nomme : c'est l'objet que le terrain crée hors ligne"
  intervention_parameters: "créée dans le même geste hors ligne que son intervention"
  intervention_working_periods: "idem : le temps de travail se saisit avec l'intervention"
  intervention_participations: "idem : les participants se saisissent avec l'intervention"
  intervention_parameter_readings: "idem : les relevés accompagnent le paramètre"
  intervention_setting_items: "idem : les réglages accompagnent l'intervention"
  observations: "l'ADR-003 la nomme"
  tasks: "l'ADR-003 la nomme"
  issues: "un incident se signale depuis la parcelle, souvent sans réseau"
  crumbs: "trace GPS produite par le mobile, par définition hors ligne"
  plant_countings: "comptage fait au champ"
  plant_counting_items: "idem, créé dans le même geste"
  inspections: "mesure faite au champ"
  inspection_points: "idem, créé dans le même geste"
  inspection_calibrations: "idem, créé dans le même geste"
  analyses: "prélèvement fait au champ"
  analysis_items: "idem, créé dans le même geste"
  worker_time_logs: "pointage fait sur le terrain"
  products: "un animal ou une plante se crée au champ, et porte déjà une colonne `uuid`"
  product_readings: "relevé fait au champ"
  attachments: "pièce jointe : l'ADR-003 les nomme"
  documents: "idem : une photo prise au champ est un document"
  active_storage_blobs: "support des pièces jointes"
  active_storage_attachments: "support des pièces jointes"
  active_storage_variant_records: "support des pièces jointes"

# Questions ouvertes : ces tables ne sont pas classées tant que la question
# n'est pas tranchée. Elles restent au plan de données par défaut, et `classify`
# les rappelle à chaque exécution.
review:
  districts: "référentiel géographique dupliqué dans chaque ferme. Le passer au plan référentiel supposerait qu'aucune ferme ne l'édite — à vérifier avant de trancher"
  postal_zones: "même question que `districts`"
  vegetative_stages: "stades BBCH : référentiel agronomique dupliqué par ferme, alors que le lexicon en porte déjà"
  net_services: "liste de services, sans donnée propre à la ferme : candidate au plan référentiel"
  units: "unités de mesure : le lexicon porte `master_units`. Fusionner ou garder une table par ferme est une décision agronomique, pas technique"
  saas_subscriptions: "porte un `tenant_name` : une ligne d'une ferme désigne une *autre* ferme par son nom. C'est exactement le lien inter-tenant que le point 1.22 doit rendre explicite"
  users: "reste au plan de données pour le lot 1 — Devise y est encore. Le trio du point 1.14 (`tenants`, `users`, `user_tenants`) est neuf ; le lot 2 réconciliera les deux avec Keycloak"

