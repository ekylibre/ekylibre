services:
  app:
    container_name: app
    image: ghcr.io/ekylibre/ekylibre/app:${EKYLIBRE_IMAGE_TAG:-latest}
    pull_policy: always
    user: ekylibre
    env_file: .env
    volumes:
      - log:/app/log
      - uploads:/app/private
      - public-assets:/app/public
      - ${GPG_KEYRING_PATH:-./secrets/gnupg}:/home/ekylibre/.gnupg:ro
      # tenants.yml persiste hors du container pour survivre aux redeploys.
      # Le fichier doit exister sur l'hote (touch + chown 1000:1000) avant le up.
      - ${TENANTS_YML_PATH:-./tenants.yml}:/app/config/tenants.yml
    command: docker/prod/startup.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3

  sidekiq:
    container_name: sidekiq
    image: ghcr.io/ekylibre/ekylibre/app:${EKYLIBRE_IMAGE_TAG:-latest}
    pull_policy: always
    user: ekylibre
    env_file: .env
    volumes:
      - log:/app/log
      - uploads:/app/private
      - ${GPG_KEYRING_PATH:-./secrets/gnupg}:/home/ekylibre/.gnupg:ro
      - ${TENANTS_YML_PATH:-./tenants.yml}:/app/config/tenants.yml
    command: docker/prod/sidekiq_startup.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    restart: on-failure

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: kartoza/postgis:13
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_PROD_NAME}
      POSTGRES_MULTIPLE_EXTENSIONS: postgis,hstore,postgis_topology,postgis_raster,pgrouting
      DUKE_USER: ${DUKE_USER}
      DUKE_PASSWORD: ${DUKE_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - database-prod-volume:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../db/init-duke-role.sh:/docker-entrypoint-initdb.d/02-init-duke-role.sh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${DB_PASSWORD} pg_isready -h db -U ${DB_USERNAME} -d ${DB_PROD_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  duke-api:
    image: ghcr.io/ekylibre/duke/duke-api:${DUKE_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: duke-api
    env_file: .env
    environment:
      EKYLIBRE_API_BASE_URL: ${EKYLIBRE_API_BASE_URL:-http://app:3000}
      EKYLIBRE_DB_DSN: ${EKYLIBRE_DB_DSN}
      DUKE_DB_DSN: ${DUKE_DB_DSN}
      MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-false}
    volumes:
      - whisper-cache:/home/duke/.cache/huggingface
    depends_on:
      postgres-duke:
        condition: service_healthy
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  postgres-duke:
    image: postgres:16-alpine
    container_name: postgres-duke
    environment:
      POSTGRES_USER: ${DUKE_DB_USER}
      POSTGRES_PASSWORD: ${DUKE_DB_PASSWORD}
      POSTGRES_DB: ${DUKE_DB_NAME}
    volumes:
      - postgres-duke-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DUKE_DB_USER} -d ${DUKE_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-mistral-nemo}"]
    restart: "no"

volumes:
  database-prod-volume:
  redis-data:
  log:
  uploads:
  public-assets:
  caddy-data:
  caddy-config:
  postgres-duke-data:
  whisper-cache:
  ollama-models:

networks:
  default:
    name: ekylibre
    driver: bridge
