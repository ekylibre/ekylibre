# Variante de docker-compose.yml adaptee a un deploiement via Dokploy.
#
# Differences avec docker-compose.yml :
#   - Aucun service Caddy (Traefik est embarque dans Dokploy et ecoute sur 80/443)
#   - Aucun port mappe sur l'hote (Traefik route via le reseau dokploy-network)
#   - Labels Traefik sur `app` et `duke-api` pour le routing et le TLS
#   - dokploy-network declare comme external (cree par Dokploy a l'installation)
#
# Voir docker/prod/DOKPLOY.md pour la procedure de deploiement complete.

services:
  app:
    image: ghcr.io/ekylibre/ekylibre/app:${EKYLIBRE_IMAGE_TAG:-latest}
    pull_policy: always
    user: ekylibre
    env_file: .env
    volumes:
      - log:/app/log
      - uploads:/app/private
      - public-assets:/app/public
      - ${GPG_KEYRING_PATH:-./secrets/gnupg}:/home/ekylibre/.gnupg:ro
      # tenants.yml persiste hors du container pour survivre aux redeploys.
      # Le fichier doit exister sur l'hote (touch + chown 1000:1000) avant le up.
      - ${TENANTS_YML_PATH:-./tenants.yml}:/app/config/tenants.yml
    command: docker/prod/startup.sh
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    networks:
      - default
      - dokploy-network   # Necessaire pour que l'UI Dokploy puisse router le domaine racine
    # Plus de labels Traefik pour les sous-domaines :
    # - Domaine racine (HOST_DOMAIN_NAME) : gere via l'onglet "Domains" de Dokploy
    # - Sous-domaines (*.HOST_DOMAIN_NAME) : geres par le service `caddy-tls` ci-dessous
    #   qui termine TLS avec ses propres certs Let's Encrypt (provisionning on-demand)
    # Voir DOKPLOY.md.

  sidekiq:
    image: ghcr.io/ekylibre/ekylibre/app:${EKYLIBRE_IMAGE_TAG:-latest}
    pull_policy: always
    user: ekylibre
    env_file: .env
    volumes:
      - log:/app/log
      - uploads:/app/private
      - ${GPG_KEYRING_PATH:-./secrets/gnupg}:/home/ekylibre/.gnupg:ro
      - ${TENANTS_YML_PATH:-./tenants.yml}:/app/config/tenants.yml
    command: docker/prod/sidekiq_startup.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        # Wait for app healthcheck (Puma up + /health 200) before starting.
        # Sinon Sidekiq tente de charger ses modeles avant la fin du lexicon load
        # -> erreurs `relation "master_legal_positions" does not exist` en boucle.
        condition: service_healthy
    restart: on-failure
    networks:
      - default

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default

  db:
    image: kartoza/postgis:13
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_PROD_NAME}
      POSTGRES_MULTIPLE_EXTENSIONS: postgis,hstore,postgis_topology,postgis_raster,pgrouting
      DUKE_USER: ${DUKE_USER}
      DUKE_PASSWORD: ${DUKE_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - database-prod-volume:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../db/init-duke-role.sh:/docker-entrypoint-initdb.d/02-init-duke-role.sh
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${DB_PASSWORD} pg_isready -h localhost -U ${DB_USERNAME} -d ${DB_PROD_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  duke-api:
    image: ghcr.io/ekylibre/duke/duke-api:${DUKE_IMAGE_TAG:-latest}
    pull_policy: always
    env_file: .env
    environment:
      EKYLIBRE_API_BASE_URL: ${EKYLIBRE_API_BASE_URL:-http://app:3000}
      EKYLIBRE_DB_DSN: ${EKYLIBRE_DB_DSN}
      DUKE_DB_DSN: ${DUKE_DB_DSN}
      MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-false}
    volumes:
      - whisper-cache:/home/duke/.cache/huggingface
    expose:
      - "8000"
    depends_on:
      postgres-duke:
        condition: service_healthy
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    # Le routing duke.HOST_DOMAIN_NAME est gere via l'onglet "Domains" de Dokploy.
    # Voir DOKPLOY.md §4.

  postgres-duke:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DUKE_DB_USER}
      POSTGRES_PASSWORD: ${DUKE_DB_PASSWORD}
      POSTGRES_DB: ${DUKE_DB_NAME}
    volumes:
      - postgres-duke-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DUKE_DB_USER} -d ${DUKE_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-mistral-nemo}"]
    restart: "no"
    networks:
      - default

  # === Caddy intermediaire : termine TLS pour TOUS les sous-domaines ===
  # Architecture :
  #   - Traefik fait passthrough TCP de *.HOST_DOMAIN_NAME vers ce Caddy
  #   - Caddy termine TLS avec ses propres certs Let's Encrypt (on-demand)
  #   - Caddy route ensuite vers app:3000 ou duke-api:8000 selon le subdomain
  #
  # Avantages :
  #   - Aucune modif de Dokploy/Traefik (pas de DNS-01, pas de var GANDIV5)
  #   - Cert valide pour chaque tenant cree, automatiquement
  #
  # Pre-requis cote Dokploy UI :
  #   - Garder l'entree pour HOST_DOMAIN_NAME (racine) -> app:3000
  #   - SUPPRIMER toute entree pour les sous-domaines (ex: duke.HOST_DOMAIN_NAME)
  caddy-tls:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./Caddyfile.dokploy:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Force le reseau utilise par Traefik pour atteindre Caddy (qui est sur 2 networks).
      - "traefik.docker.network=dokploy-network"
      # === Port 443 : Traefik fait du TCP passthrough sur SNI wildcard ===
      # Traefik ne dechiffre pas TLS, Caddy le fait lui-meme avec ses certs LE.
      # IMPORTANT : HostSNI() n'accepte pas le wildcard partiel (`*.host`), il faut HostSNIRegexp.
      - "traefik.tcp.routers.ekylibre-tls-pass.rule=HostSNIRegexp(`^[a-z0-9-]+\\.${HOST_DOMAIN_NAME}$$`)"
      - "traefik.tcp.routers.ekylibre-tls-pass.entrypoints=websecure"
      - "traefik.tcp.routers.ekylibre-tls-pass.tls.passthrough=true"
      - "traefik.tcp.routers.ekylibre-tls-pass.service=ekylibre-tls-pass"
      - "traefik.tcp.services.ekylibre-tls-pass.loadbalancer.server.port=443"
      # === Port 80 : forward HTTP pour le challenge ACME HTTP-01 ===
      # Necessaire pour que Let's Encrypt puisse valider le domaine.
      - "traefik.http.routers.ekylibre-acme.rule=HostRegexp(`^[a-z0-9-]+\\.${HOST_DOMAIN_NAME}$$`)"
      - "traefik.http.routers.ekylibre-acme.entrypoints=web"
      - "traefik.http.routers.ekylibre-acme.service=ekylibre-acme"
      - "traefik.http.services.ekylibre-acme.loadbalancer.server.port=80"

volumes:
  database-prod-volume:
  redis-data:
  log:
  uploads:
  public-assets:
  postgres-duke-data:
  whisper-cache:
  ollama-models:
  caddy-data:
  caddy-config:

networks:
  default:
    driver: bridge
  dokploy-network:
    external: true
