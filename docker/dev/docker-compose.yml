services:
  app:
    container_name: app
    stdin_open: true
    tty: true
    build:
      dockerfile: docker/dev/Dockerfile
      context: ../..
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: .env
    environment:
      # webpack 4 hache en MD4, qu'OpenSSL 3 refuse depuis Node 17 : sans ce
      # drapeau `bin/webpack` meurt sur ERR_OSSL_EVP_UNSUPPORTED, le manifest
      # packs-test reste vide, et toute vue rendant `javascript_pack_tag :legacy`
      # échoue — d'où les tests de contrôleur en erreur de longue date.
      NODE_OPTIONS: --openssl-legacy-provider
    ports:
      - "3000:3000"
      - '8808:8808'
    volumes:
      - ../..:/app
      - ../../../ekylibre-plugins:/ekylibre-plugins
      - bundle-volume:/app/vendor/bundle
      - docker-dev:/app/docker/dev
    command: docker/startup.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    container_name: sidekiq
    build:
      dockerfile: docker/dev/Dockerfile
      context: ../..
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: .env
    volumes:
      - ../..:/app
      - ../../../ekylibre-plugins:/ekylibre-plugins
      - bundle-volume:/app/vendor/bundle
      - docker-dev:/app/docker/dev
    command: /app/docker/dev/sidekiq_startup.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: on-failure

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: kartoza/postgis:13
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DEV_NAME}
      DUKE_USER: ${DUKE_USER}
      DUKE_PASSWORD: ${DUKE_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - database-volume:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../db/init-duke-role.sh:/docker-entrypoint-initdb.d/02-init-duke-role.sh
    ports:
      - "5431:5432"
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
    healthcheck:
      test: "PGPASSWORD=${DB_PASSWORD} pg_isready -h db -U ${DB_USERNAME} -d ${DB_DEV_NAME}"

volumes:
  database-volume:
  bundle-volume:
  docker-dev:
  caddy-data:
  caddy-config:

networks:
  default:
    name: ekylibre
    driver: bridge
