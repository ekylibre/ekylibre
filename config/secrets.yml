# Be sure to restart your server when you modify this file.

# Your secret key is used for verifying the integrity of signed cookies.
# If you change this key, all old signed cookies will become invalid!

# Make sure the secret is at least 30 characters and all random,
# no regular words or you'll be exposed to dictionary attacks.
# You can use `rails secret` to generate a secure secret key.

# Make sure the secrets in this file are kept private
# if you're sharing your code publicly.

# Shared secrets are available across all environments.

# shared:
#   api_key: a1B2c3D4e5F6

# Environmental secrets are only available for that specific environment.

<%
  # Never commit a secret_key_base, not even for development: a tracked value is
  # a shared value. Read it from the environment, else keep a per-checkout
  # random one under tmp/ (git-ignored, regenerated when absent).
  #
  # Only development and test use this fallback. Production still reads
  # ENV["SECRET_KEY_BASE"] and must fail loudly when it is missing, rather than
  # silently minting a new key that invalidates every session on restart.
  require 'securerandom'
  require 'fileutils'

  def local_secret_key_base(env_name)
    return ENV['SECRET_KEY_BASE'] unless ENV['SECRET_KEY_BASE'].to_s.empty?

    path = Rails.root.join('tmp', "#{env_name}_secret.txt")
    return path.read.strip if path.exist?

    secret = SecureRandom.hex(64)
    FileUtils.mkdir_p(path.dirname)
    path.write(secret)
    path.chmod(0o600)
    secret
  end
%>

development:
  secret_key_base: <%= local_secret_key_base('development') %>

test:
  secret_key_base: <%= local_secret_key_base('test') %>

# Do not keep production secrets in the unencrypted secrets file.
# Instead, either read values from the environment.
# Or, use `bin/rails secrets:setup` to configure encrypted secrets
# and move the `production:` environment over there.

production:
  secret_key_base: <%= ENV["SECRET_KEY_BASE"] %>
