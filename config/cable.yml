development: &default
  adapter: redis
  url: <%= ENV.fetch('REDIS_URL', 'redis://localhost:6379') %>

# L'adaptateur `test` recueille les diffusions en mémoire : c'est la
# configuration que Rails génère pour cet environnement, et elle évite d'ouvrir
# une connexion Redis que rien ne lit.
test:
  adapter: test

production: *default
