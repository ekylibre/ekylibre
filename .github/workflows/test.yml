# Suite de tests. Remplace le job `test` de .gitlab-ci.yml, la CI passant
# entièrement sur GitHub.
#
# Le job tourne DANS l'image de base du projet plutôt que sur ubuntu-latest :
# la suite a besoin de Ruby 3.4.10, de GraphicsMagick, LibreOffice, Ghostscript,
# poppler et du client PostgreSQL, tous déjà présents dans cette image, qui est
# aussi celle du développement et de la production. Les reconstituer étape par
# étape sur un runner nu serait long et divergerait avec le temps.
name: Tests

on:
  push:
    branches: [ 6.0-alpha ]
  pull_request:
    branches: [ 6.0-alpha ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ekylibre/docker-base-images/ruby3.4.10:latest

    services:
      # PostgreSQL 18 aligne la CI sur la pile de développement
      # (postgis/postgis:18-3.6), et c'est la version qui porte `uuidv7()`
      # native. Elle exige le client 18 de l'image de base ci-dessus
      # (docker-base-images@6281aea) : `pg_dump` refuse un serveur plus récent
      # que lui — mesuré, « server version: 18.6 ; pg_dump version: 17.11 » —
      # et Apartment l'appelle à chaque création de tenant, donc au montage des
      # tenants de test.
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: ekylibre
          POSTGRES_DB: ekylibre_test
          # test/ci/database.yml ne porte pas de mot de passe : le serveur doit
          # donc accepter les connexions sans authentification. Poser un
          # POSTGRES_PASSWORD ferait basculer l'image en scram et casserait
          # aussi bien psql que la connexion de Rails.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:5.0-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      COVERAGE: 'true'
      CI: 'true'
      TZ: Europe/Paris
      REDIS_URL: redis://redis:6379/
      POSTGRES_HOST: postgres
      POSTGRES_USER: ekylibre
      POSTGRES_DB: ekylibre_test
      DB_HOST: postgres
      DB_USERNAME: ekylibre
      DB_TEST_NAME: ekylibre_test
      # Identité de la clé importée à l'étape « Importer la clé GPG des tests ».
      # Sans elle, la signature de document refuse de s'exécuter — « GPG_EMAIL is
      # blank » — et les tests d'impression signée échouent, alors que la clé est
      # bien dans le trousseau.
      GPG_EMAIL: do-not-trust-key@ekylibre.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache des gems
        uses: actions/cache@v4
        with:
          path: vendor/ruby
          key: gems-${{ runner.os }}-ruby3.4.10-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-ruby3.4.10-

      - name: Cache des paquets node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: node-${{ runner.os }}-

      - name: Installer les dépendances
        run: |
          set -euo pipefail
          bundle config --local build.sassc --disable-march-tune-native
          bundle config --local path vendor/ruby
          bundle install -j "$(nproc)"
          yarn install --frozen-lockfile

      - name: Préparer les extensions PostgreSQL
        # Une instruction par appel psql, et IF EXISTS sur le DROP. Regroupées
        # dans un seul -c, elles sont couplées : un DROP EXTENSION en échec
        # annule le CREATE SCHEMA de la même transaction implicite, et chaque
        # CREATE EXTENSION suivant meurt sur « schema "postgis" does not exist ».
        run: |
          set -euo pipefail
          psql_exec() { psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1"; }
          psql_exec 'DROP EXTENSION IF EXISTS postgis CASCADE;'
          # L'image postgis/postgis installe aussi fuzzystrmatch et le
          # géocodeur tiger dans `public`. Le CASCADE ci-dessus emporte le
          # second, pas le premier — même nettoyage qu'en développement.
          psql_exec 'DROP EXTENSION IF EXISTS fuzzystrmatch;'
          psql_exec 'DROP SCHEMA IF EXISTS tiger_data CASCADE;'
          psql_exec 'DROP SCHEMA IF EXISTS tiger CASCADE;'
          psql_exec 'DROP SCHEMA IF EXISTS topology CASCADE;'
          psql_exec 'CREATE SCHEMA IF NOT EXISTS postgis;'
          psql_exec 'CREATE EXTENSION IF NOT EXISTS postgis SCHEMA postgis;'
          psql_exec 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp" SCHEMA postgis;'
          psql_exec 'CREATE EXTENSION IF NOT EXISTS "unaccent" SCHEMA postgis;'
          psql_exec 'CREATE EXTENSION IF NOT EXISTS "pg_trgm" SCHEMA postgis;'
          cp -f test/ci/database.yml config/database.yml

      - name: Importer la clé GPG des tests
        # Les tests de signature de document en ont besoin.
        run: gpg --import test/fixture-files/my-private-key.asc

      - name: Charger le schéma de test, puis les migrations postérieures
        # `db:migrate` ne suffit plus depuis Rails 8 : sur une base sans
        # `schema_migrations`, il charge d'abord `db/structure.sql` — et ce
        # chargement échoue ici pour deux raisons cumulées. Le dump contient
        # `CREATE SCHEMA postgis` et `CREATE SCHEMA public`, que l'étape
        # précédente a déjà créés pour y installer les extensions, et Rails
        # impose `ON_ERROR_STOP=1` à son `psql`.
        #
        # Rejouer les 721 migrations depuis zéro n'est pas une solution de
        # repli : `t.attachment`, que Paperclip fournissait aux migrations, est
        # employé par `20121212122000_create_base.rb:306` et la gem est partie
        # avec le passage à Active Storage.
        #
        # Le dump est donc chargé à la main, sans arrêt sur erreur, et les seules
        # erreurs tolérées sont ces schémas déjà présents : toute autre fait
        # échouer l'étape. `db:migrate` applique ensuite les migrations
        # postérieures au dump — celles qu'il contient sont déjà inscrites dans
        # `schema_migrations`.
        run: |
          set -euo pipefail
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
               --quiet --no-psqlrc --output /dev/null -f db/structure.sql 2> psql-load.err || true
          if grep -E '^psql:.*ERROR' psql-load.err | grep -qv 'already exists'; then
            echo "Erreurs inattendues au chargement du schéma :"
            cat psql-load.err
            exit 1
          fi
          bundle exec rake db:migrate VERBOSE=false

      - name: Vérifier la classification des tables
        # Point 1.5 : toute table de db/structure.sql doit être classée dans un
        # plan — contrôle, données ou référentiel. Une migration qui en ajoute
        # une sans le dire met la CI au rouge ici, plutôt que de laisser une
        # table sans `tenant_id` jusqu'à ce qu'un client voie les données d'un
        # autre. Le plan engendré doit par ailleurs être à jour dans le dépôt.
        run: |
          set -euo pipefail
          bundle exec rake monoschema:check
          bundle exec rake monoschema:classify
          # `safe.directory` : le job tourne en root dans le conteneur, la copie
          # de travail appartient à un autre utilisateur, et git refuse sinon de
          # lire un dépôt « douteux ».
          git config --global --add safe.directory "$PWD"
          git diff --exit-code db/monoschema/plan.yml

      - name: Monter la base du prototype de mono-schéma
        # Point 1.4 : les garanties d'isolation (RLS, clés composites, index
        # tenant-aware) sont vérifiées à chaque passage, pas une fois pour
        # toutes. Sans cette base, test/prototypes/monoschema_test.rb s'ignore
        # au lieu d'échouer — la CI est le seul endroit où il doit tourner
        # systématiquement.
        run: bundle exec rake monoschema:build

      - name: Compiler les packs Webpacker
        # Sans eux, toute vue rendant `javascript_pack_tag :legacy` échoue sur un
        # manifest packs-test vide — ce qui met en erreur les tests de contrôleur
        # rendant une mise en page.
        #
        # --openssl-legacy-provider est indispensable : webpack 4 hache en MD4,
        # qu'OpenSSL 3 (Node 17+) refuse, et `bin/webpack` meurt sur
        # ERR_OSSL_EVP_UNSUPPORTED. C'est la vraie cause du manifest vide.
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: bundle exec bin/webpack

      - name: Exécuter la suite
        run: bundle exec bin/rails test

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
